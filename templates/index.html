<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Geo Fronts Report</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
    </head>

    <body>
        <header id="siteHeader">
            <h1 id="siteMasthead">𝕿𝖍𝖊 𝕲𝖊𝖔 𝕱𝖗𝖔𝖓𝖙𝖘 𝕽𝖊𝖕𝖔𝖗𝖙</h1>
            <p id="siteTagline">Stay up to date with the world's geopolitics</p>
        </header>
        <!--<div id="authForm">
            <button id="loginButton">Login to submit articles</button>
        </div>-->
        <div id="mapControls">
            <button id="switchMapButton">Switch Map Details</button>

            <div id="routeControls">
                <button id="showAllRoutesButton" class="active">Show all routes</button>
                <button id="exploreCountryButton">Explore by country</button>
                <button id="hideCountryRoutesButton" hidden>Hide lines</button>
                <span id="selectedCountryLabel"></span>
            </div>
        </div>
        <!--<button id="switchGeoLevelButton">Switch Geo Level Button</button>-->
        <div id="mainLayout">
            <div id="map"></div>

            <div id="articleSidebar">
                <div id="sidebarHeader">
                    <h2>Recent Relationships</h2>
                    <label for="relationshipSearch" class="visuallyHidden">
                        Search country relationships
                    </label>
                    <input
                        id="relationshipSearch"
                        type="search"
                        placeholder="Search countries…"
                        autocomplete="off"
                    >
                </div>
                <div id="articleList"></div>
            </div>
        </div>
        
         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <script src="{{ url_for('static',filename='script.js')}}"></script>

        <img 
        class="windowsButton"
        src="https://capstasher.neocities.org/88x31Buttons/36581483_P5h.gif" alt="88x31 button">
        
    </body>
</html>
