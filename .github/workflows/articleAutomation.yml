name: Update geopolitical articles

on:
  schedule:
    - cron: "17 8 */2 * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scraper and Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python newscraper.py

      - name: Save updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/articles.json static/articles_backup.json
          git diff --cached --quiet || git commit -m "Update geopolitical articles"
          git push